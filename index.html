<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->

        <header>

            <h1>📄 AI Resume Analyzer</h1>

            <p class="subtitle">
                Upload your resume and get an AI-powered
                analysis, score, skill suggestions and
                suitable career roles.
            </p>

        </header>


        <!-- Upload Section -->

        <div class="upload-box">

            <div class="upload-icon">
                📄
            </div>

            <h2>Upload Your Resume</h2>

            <p>
                Upload your resume in PDF format
            </p>


            <!-- File Input -->

            <input
                type="file"
                id="resume"
                accept=".pdf,application/pdf"
            >


            <!-- Choose File Button -->

            <label
                for="resume"
                class="file-label"
            >
                📁 Choose PDF
            </label>


            <!-- Selected File Name -->

            <p
                id="fileName"
                class="file-name"
            >
                No file selected
            </p>


            <!-- Analyze Button -->

            <button
                type="button"
                id="analyzeBtn"
            >
                🔍 Analyze Resume
            </button>


            <!-- Reset Button -->

            <button
                type="button"
                id="resetBtn"
                class="reset-btn"
            >
                🔄 Analyze Another Resume
            </button>

        </div>


        <!-- Result Section -->

        <div id="result">

            <div id="status">

                <h3>📄 Resume Analysis</h3>

                <p>
                    Your AI analysis will appear here.
                </p>

            </div>

        </div>


        <!-- Footer -->

        <footer>

            <p>
                AI Resume Analyzer | Powered by n8n
            </p>

        </footer>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
